sdk-version: 3.4.11
name: openzeppelin-interop
source: daml
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../token-standard-v2-mock/.daml/dist/openzeppelin-token-standard-v2-mock-0.1.0.dar
  - ../settlement/.daml/dist/openzeppelin-settlement-0.1.0.dar
build-options:
  - --target=2.1
  # The CIP-0086/0103/0104 interop proof (`OpenZeppelin.Interop.*`). This is a
  # consumer/exemplar package: its facade template (Cip0086Erc20's Erc20Allowance)
  # sits next to the executable scripts that assert real interop against the
  # settlement engine, and it is never shipped as a library DAR — so daml-script
  # next to a consumer template is fine. The shipped LIBRARY packages
  # (token-standard-v2-mock, settlement) stay daml-script-free.
  - -Wno-template-interface-depends-on-daml-script
