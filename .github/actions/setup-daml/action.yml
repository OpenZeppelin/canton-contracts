name: Set up Daml
description: Set up Java, DPM, and the workspace Daml SDK.

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Cache DPM and SDKs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.dpm
        key: dpm-${{ runner.os }}-sdk-${{ hashFiles('multi-package.yaml') }}-v3

    - name: Provision DPM and the project SDK
      shell: bash
      run: |
        set -euo pipefail

        # Bootstrap DPM from the workspace SDK bundle so cached and fresh
        # runners use the same DPM.
        if [ ! -x "$HOME/.dpm/bin/dpm" ]; then
          version="$(sed -n 's/^sdk-version:[[:space:]]*//p' multi-package.yaml)"
          [ -n "$version" ] || {
            echo "::error::multi-package.yaml does not declare sdk-version." >&2
            exit 1
          }
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          os="$(uname | tr '[:upper:]' '[:lower:]')"
          tarball="dpm-${version}-${os}-${arch}.tar.gz"
          tmp="$(mktemp -d)"

          curl -SLf "https://get.digitalasset.com/install/dpm-sdk/${tarball}" -o "${tmp}/${tarball}"
          mkdir -p "${tmp}/extracted"
          tar xzf "${tmp}/${tarball}" -C "${tmp}/extracted" --strip-components 1
          "${tmp}/extracted/bin/dpm" bootstrap "${tmp}/extracted"
          rm -rf "${tmp}"
        fi

        echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.dpm/bin:$PATH"
        command -v dpm >/dev/null 2>&1 || {
          echo "::error::dpm not on PATH after install (expected ~/.dpm/bin/dpm)." >&2
          exit 1
        }

        dpm install
