name: test coverage

# This workflow backs the README choice coverage badge. The coverage script fails when
# a production template, template choice, or interface choice is uncovered.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Daml
        uses: ./.github/actions/setup-daml

      - name: Build all packages
        run: dpm build --all

      - name: Test all packages and enforce production coverage
        run: scripts/check-coverage.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: test-reports/
          if-no-files-found: ignore
