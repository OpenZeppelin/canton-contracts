name: ci

# Validation gate for the OpenZeppelin Daml contracts library: enforce package
# boundaries, build every package in dependency order, and lint every package.
#
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OZ_DAML_TOOLCHAIN: dpm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Daml
        uses: ./.github/actions/setup-daml

      - name: Check repository structure and package boundaries
        run: scripts/check.sh

      - name: Build all packages
        run: dpm build --all

      - name: Lint all packages
        run: scripts/check-lint.sh

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [token, authorization, licensing, treasury]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Daml
        uses: ./.github/actions/setup-daml
      - name: Validate against a Canton ledger
        env:
          OZ_SANDBOX_SUITE: ${{ matrix.suite }}
        run: scripts/check-sandbox.sh
      - name: Upload sandbox logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-${{ matrix.suite }}
          path: .cache/sandbox-${{ matrix.suite }}/
