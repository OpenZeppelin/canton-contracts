name: ci

# Validation gate for the OpenZeppelin Daml contracts library: build every
# package in dependency order, enforce package boundaries, lint every package,
# check for typos, and run the consumer examples.
#
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Daml
        uses: ./.github/actions/setup-daml

      - name: Build all packages
        run: dpm build --all

      - name: Check repository structure and package boundaries
        run: scripts/check.sh

      - name: Lint all packages
        run: scripts/check-lint.sh

      - name: Run consumer examples
        run: scripts/check-examples.sh

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check spelling
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  sandbox:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [token, authorization, licensing, treasury, vault, vault-permits, vault-fund]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Daml
        uses: ./.github/actions/setup-daml
      - name: Validate against a Canton ledger
        env:
          OZ_SANDBOX_SUITE: ${{ matrix.suite }}
        run: scripts/check-sandbox.sh
      - name: Upload sandbox logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-${{ matrix.suite }}
          path: .cache/sandbox-${{ matrix.suite }}/
