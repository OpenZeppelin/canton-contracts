name: ci

# Validation gate for the OpenZeppelin Daml contracts library: build every
# package in dependency order, enforce package boundaries, lint every package,
# run the consumer examples, and run every test. The test step fails when a
# test fails or a production template, template choice, or interface choice
# is uncovered.
#
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OZ_DAML_TOOLCHAIN: dpm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Daml
        uses: ./.github/actions/setup-daml

      - name: Build all packages
        run: dpm build --all

      - name: Check repository structure and package boundaries
        run: scripts/check.sh

      - name: Lint all packages
        run: scripts/check-lint.sh

      - name: Run consumer examples
        run: scripts/check-examples.sh

      - name: Test all packages and enforce production coverage
        run: scripts/check-coverage.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: test-reports/
          if-no-files-found: ignore

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [token, authorization, licensing, treasury]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Daml
        uses: ./.github/actions/setup-daml
      - name: Validate against a Canton ledger
        env:
          OZ_SANDBOX_SUITE: ${{ matrix.suite }}
        run: scripts/check-sandbox.sh
      - name: Upload sandbox logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-${{ matrix.suite }}
          path: .cache/sandbox-${{ matrix.suite }}/
