sdk-version: 3.5.8
name: async-vault-fund-example-test
source: daml
version: 0.0.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  # The vault under demonstration: its templates, the records they store, and
  # the failure statuses of its choice bodies. Paths are relative to this
  # daml.yaml.
  - ../../../packages/vault/async-vault-types-v1/.daml/dist/openzeppelin-async-vault-types-v1-0.1.0.dar
  - ../../../packages/vault/async-vault-utils/.daml/dist/openzeppelin-async-vault-utils-0.1.0.dar
  - ../../../packages/vault/async-vault-v1/.daml/dist/openzeppelin-async-vault-v1-0.1.0.dar
  # The vault's deposit gate, and the grant a validator holds.
  - ../../../packages/vault/async-vault-permits-v1/.daml/dist/openzeppelin-async-vault-permits-v1-0.1.0.dar
  - ../../../packages/access/scoped-authorization-grant-v1/.daml/dist/openzeppelin-scoped-authorization-grant-v1-0.1.0.dar
  # The registry of both instruments.
  - ../../../packages/token/token-cip112-types-v1/.daml/dist/openzeppelin-token-cip112-types-v1-0.1.0.dar
  - ../../../packages/token/token-cip112-v1/.daml/dist/openzeppelin-token-cip112-v1-0.1.0.dar
  # Vendored Token Standard V2 (CIP-0112) DARs; see dars/manifest.yaml.
  - ../../../dars/vendor/splice-api-token-metadata-v1-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-holding-v2-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-allocation-v2-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-transfer-instruction-v2-1.0.0.dar
  - ../../../dars/vendor/splice-token-standard-utils-2.0.0.dar
build-options:
  # Match the packages under demonstration and the vendored API DARs.
  - --target=2.1
