sdk-version: 3.5.8
name: token-cip112-trading-example-test
source: daml
version: 0.0.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  # The package under demonstration, its types and utils dependencies, and the
  # vendored Token Standard V2 DARs. Paths are relative to this daml.yaml.
  - ../../../packages/token/token-cip112-types-v1/.daml/dist/openzeppelin-token-cip112-types-v1-0.1.0.dar
  - ../../../packages/token/token-cip112-utils/.daml/dist/openzeppelin-token-cip112-utils-0.1.0.dar
  - ../../../packages/token/token-cip112-v1/.daml/dist/openzeppelin-token-cip112-v1-0.1.0.dar
  - ../../../dars/vendor/splice-api-token-metadata-v1-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-holding-v2-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-allocation-v2-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../../../dars/vendor/splice-token-standard-utils-2.0.0.dar
build-options:
  # Match the packages under demonstration and the vendored API DARs.
  - --target=2.1
