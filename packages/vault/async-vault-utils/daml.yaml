sdk-version: 3.5.8
name: openzeppelin-async-vault-utils
source: daml
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # The records these functions read and return.
  - ../async-vault-types-v1/.daml/dist/openzeppelin-async-vault-types-v1-0.1.0.dar
  # The deposit gate interface that `checkDepositGate` calls.
  - ../api-async-vault-v1/.daml/dist/openzeppelin-api-async-vault-v1-0.1.0.dar
  # Vendored Token Standard V2 (CIP-0112) DARs; see dars/manifest.yaml.
  - ../../../dars/vendor/splice-api-token-metadata-v1-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-holding-v2-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-allocation-v2-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../../../dars/vendor/splice-token-standard-utils-2.0.0.dar
build-options:
  - --target=2.1
