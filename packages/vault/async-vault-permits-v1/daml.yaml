sdk-version: 3.5.8
name: openzeppelin-async-vault-permits-v1
source: daml
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # The deposit gate interface these templates implement.
  - ../api-async-vault-v1/.daml/dist/openzeppelin-api-async-vault-v1-0.1.0.dar
  # The grant a vault's admin gives a validator, and the checks on it.
  - ../../access/scoped-authorization-grant-v1/.daml/dist/openzeppelin-scoped-authorization-grant-v1-0.1.0.dar
  # Vendored Token Standard V2 (CIP-0112) DARs; see dars/manifest.yaml.
  - ../../../dars/vendor/splice-api-token-metadata-v1-1.0.0.dar
  - ../../../dars/vendor/splice-api-token-holding-v2-1.0.0.dar
build-options:
  - --target=2.1
