sdk-version: 3.5.8
name: openzeppelin-async-vault-utils-test
source: daml
version: 0.0.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  # The package under test and the types package whose records it reads.
  # Paths are relative to this daml.yaml.
  - ../../packages/vault/async-vault-types-v1/.daml/dist/openzeppelin-async-vault-types-v1-0.1.0.dar
  - ../../packages/vault/async-vault-utils/.daml/dist/openzeppelin-async-vault-utils-0.1.0.dar
  # The deposit gate interface the gate tests implement.
  - ../../packages/vault/api-async-vault-v1/.daml/dist/openzeppelin-api-async-vault-v1-0.1.0.dar
  # The token types and utils the test registry is built on. The fixtures
  # define their own templates over them.
  - ../../packages/token/token-cip112-types-v1/.daml/dist/openzeppelin-token-cip112-types-v1-0.1.0.dar
  - ../../packages/token/token-cip112-utils/.daml/dist/openzeppelin-token-cip112-utils-0.1.0.dar
  # Vendored Token Standard V2 (CIP-0112) DARs; see dars/manifest.yaml.
  - ../../dars/vendor/splice-api-token-metadata-v1-1.0.0.dar
  - ../../dars/vendor/splice-api-token-holding-v2-1.0.0.dar
  - ../../dars/vendor/splice-api-token-transfer-events-v2-1.0.0.dar
  - ../../dars/vendor/splice-api-token-allocation-v2-1.0.0.dar
  - ../../dars/vendor/splice-api-token-transfer-instruction-v2-1.0.0.dar
  - ../../dars/vendor/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../../dars/vendor/splice-token-standard-utils-2.0.0.dar
build-options:
  - --target=2.1
  - -Wno-template-interface-depends-on-daml-script
