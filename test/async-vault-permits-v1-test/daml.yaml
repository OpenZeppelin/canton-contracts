sdk-version: 3.5.8
name: openzeppelin-async-vault-permits-v1-test
source: daml
version: 0.0.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  # The package under test, the gate interface it implements, and the grant
  # package it builds on. Paths are relative to this daml.yaml.
  - ../../packages/vault/async-vault-permits-v1/.daml/dist/openzeppelin-async-vault-permits-v1-0.1.0.dar
  - ../../packages/vault/api-async-vault-v1/.daml/dist/openzeppelin-api-async-vault-v1-0.1.0.dar
  - ../../packages/access/scoped-authorization-grant-v1/.daml/dist/openzeppelin-scoped-authorization-grant-v1-0.1.0.dar
  # The vault's own call of a deposit gate, which the sandbox scripts ask
  # the gate through, and the records it takes. Neither defines a template.
  - ../../packages/vault/async-vault-types-v1/.daml/dist/openzeppelin-async-vault-types-v1-0.1.0.dar
  - ../../packages/vault/async-vault-utils/.daml/dist/openzeppelin-async-vault-utils-0.1.0.dar
  # Vendored Token Standard V2 (CIP-0112) DARs; see dars/manifest.yaml.
  - ../../dars/vendor/splice-api-token-metadata-v1-1.0.0.dar
  - ../../dars/vendor/splice-api-token-holding-v2-1.0.0.dar
build-options:
  - --target=2.1
  - -Wno-template-interface-depends-on-daml-script
