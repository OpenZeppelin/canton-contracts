sdk-version: 3.5.8
name: openzeppelin-cip112-token-v1-test
source: daml
version: 0.0.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  # The packages under test, plus the vendored Token Standard V2 DARs their
  # interfaces come from. Paths are relative to this daml.yaml.
  - ../../packages/token/cip112-token-types-v1/.daml/dist/openzeppelin-cip112-token-types-v1-0.1.0.dar
  - ../../packages/token/cip112-token-utils/.daml/dist/openzeppelin-cip112-token-utils-0.1.0.dar
  - ../../packages/token/cip112-token-v1/.daml/dist/openzeppelin-cip112-token-v1-0.1.0.dar
  - ../../dars/vendor/splice-api-token-metadata-v1-1.0.0.dar
  - ../../dars/vendor/splice-api-token-holding-v2-1.0.0.dar
  - ../../dars/vendor/splice-api-token-transfer-events-v2-1.0.0.dar
  - ../../dars/vendor/splice-api-token-allocation-v2-1.0.0.dar
  - ../../dars/vendor/splice-api-token-transfer-instruction-v2-1.0.0.dar
  - ../../dars/vendor/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../../dars/vendor/splice-token-standard-utils-2.0.0.dar
build-options:
  - --target=2.1
  - -Wno-template-interface-depends-on-daml-script
