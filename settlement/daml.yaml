sdk-version: 3.4.11
name: openzeppelin-settlement
source: daml
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../token-standard-v2-mock/.daml/dist/openzeppelin-token-standard-v2-mock-0.1.0.dar
